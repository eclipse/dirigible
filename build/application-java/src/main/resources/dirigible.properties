# Deployment overrides of the Java edition (#8011). This file is found before the default
# application's dirigible.properties (which ships inside this edition as a library), so it repeats
# the product identity that file declares, and adds the product type that tells the editions apart
# in the About window and /services/core/version.
DIRIGIBLE_PRODUCT_NAME=${project.title}
DIRIGIBLE_PRODUCT_VERSION=${project.version}
DIRIGIBLE_PRODUCT_COMMIT_ID=${git.commit.id}
DIRIGIBLE_PRODUCT_TYPE=java
